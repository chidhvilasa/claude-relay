name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: false
          
      - name: Install Dependencies
        run: |
          pnpm approve-builds esbuild
          pnpm install
          
      - name: Lint
        run: pnpm lint
        
      - name: Typecheck
        run: pnpm typecheck
        
      - name: Test
        run: pnpm test
        
      - name: Build
        run: pnpm build
        
      - name: Package VSIX
        run: pnpm package

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: false
          
      - name: Install Dependencies
        run: |
          pnpm approve-builds esbuild
          pnpm install
          
      - name: Lint
        run: pnpm lint
        
      - name: Typecheck
        run: pnpm typecheck
        
      - name: Core Tests
        run: pnpm --filter @claude-relay/core test
        
      - name: Build
        run: pnpm build
