name: Bug Report
description: File a bug report for Claude Relay
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **WARNING:** Do NOT paste API keys, Claude credentials, private repository contents, or sensitive handoff contents in this issue.
  - type: input
    id: relay-version
    attributes:
      label: Claude Relay Companion version
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Claude Relay Plugin version (if installed)
      placeholder: "0.2.1"
    validations:
      required: false
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: "1.90.0"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version (claude --version)
      placeholder: "2.1.217"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11 / macOS / Ubuntu"
    validations:
      required: true
  - type: textarea
    id: health-check
    attributes:
      label: Health Check Output
      description: Paste the output of the 'Claude Relay: Health Check' command here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do to encounter the bug?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
